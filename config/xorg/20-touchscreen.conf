# MaiaLinux Touchscreen & Input Configuration for Anbernic RG353V

Section "InputClass"
    Identifier "RG353V Touchscreen"
    MatchIsTouchscreen "on"
    Driver "libinput"
    Option "Tapping" "on"
    Option "CalibrationMatrix" "1 0 0 0 1 0 0 0 1"
EndSection

Section "InputClass"
    Identifier "Generic Libinput Pointer"
    MatchIsPointer "on"
    Driver "libinput"
    Option "AccelProfile" "flat"
EndSection

Section "InputClass"
    Identifier "Generic Libinput Keyboard"
    MatchIsKeyboard "on"
    Driver "libinput"
EndSection
