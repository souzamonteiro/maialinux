# MaiaLinux Xorg Configuration for Anbernic RG353V (Rockchip RK3566)
# Disables Glamor to avoid GBM/EGL conflicts with ArkOS proprietary libMali blob
# while keeping DRM modesetting at 640x480@60Hz.

Section "Device"
    Identifier "RockchipDRM"
    Driver "modesetting"
    Option "AccelMethod" "none"
    Option "DRI" "2"
    Option "SWcursor" "true"
    Option "PageFlip" "true"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "RockchipDRM"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "640x480"
    EndSubSection
EndSection

Section "ServerFlags"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
    Option "AutoAddGPU" "false"
EndSection
