[System]
Archiver=file-roller
FallbackIconThemeName=Papirus-Dark
IconThemeName=Papirus-Dark
SuCommand=lxqt-sudo %s
Terminal=qterminal

[Behavior]
BookmarkOpenMethod=current_tab
ConfirmDelete=true
SingleClick=false
UseTrash=false

[Desktop]
BgColor=#181825
FgColor=#cdd6f4
Font="DejaVu Sans,8,-1,5,50,0,0,0,0,0"
ShadowColor=#000000
ShowHidden=false
ShowMounts=false
ShowTrash=false
ShowWallpaper=true
SortColumn=name
SortOrder=ascending
Wallpaper=/etc/maialinux-runtime/wallpaper.png
WallpaperMode=stretch

[FolderView]
BigIconSize=32
CompactIconSize=16
Mode=icon
SmallIconSize=24
ThumbnailIconSize=64

[Window]
FixedHeight=420
FixedWidth=620
SplitterPos=130
