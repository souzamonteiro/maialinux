[General]
__userfile__=true
panels=panel1

[panel1]
alignment=-1
animation-duration=0
background-color=@Variant(\0\0\0\x43\x1\xff\xff\x18\x18\x18\x18\x25\x25\0\0)
background-image=
font-color=@Variant(\0\0\0\x43\x1\xff\xff\xcd\xcd\xd6\xd6\xf4\xf4\0\0)
hidable=false
hide-on-overlap=false
iconSize=18
lineCount=1
lockPanel=false
opacity=95
panelSize=24
plugins=mainmenu, quicklaunch, taskbar, tray, statusnotifier, mainclock, showdesktop
position=Bottom
reserve-space=true
 visible-margin=true
width=100
width-percent=true

[mainmenu]
alignment=Left
showText=true
text=Maia
type=mainmenu

[quicklaunch]
alignment=Left
 apps\1\desktop=/usr/local/share/applications/maialinux-keyboard.desktop
apps\2\desktop=/usr/share/applications/qterminal.desktop
apps\3\desktop=/usr/share/applications/geany.desktop
apps\4\desktop=/usr/share/applications/pcmanfm-qt.desktop
apps\size=4
type=quicklaunch

[taskbar]
alignment=Left
buttonStyle=IconText
closeOnMiddleClick=true
cycleOnWheelScroll=true
groupingEnabled=false
maxButtonWidth=110
raiseOnCurrentDesktop=false
showDesktopNum=false
type=taskbar
wheelDeltaThreshold=250

[tray]
alignment=Right
type=tray

[statusnotifier]
alignment=Right
type=statusnotifier

[mainclock]
alignment=Right
format="HH:mm"
type=clock
useUTC=false

[showdesktop]
alignment=Right
type=showdesktop
